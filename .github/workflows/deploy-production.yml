name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: Build, test, and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: production
      url: https://lastround.online

    # Required repository or production-environment secrets:
    #   SSH_PRIVATE_KEY   Private key for GitHub Actions -> Namecheap SSH
    #   SSH_KNOWN_HOSTS   Verified ssh-keyscan output for [host]:port
    #   SSH_HOST          premium350.web-hosting.com
    #   SSH_PORT          21098
    #   SSH_USER          fitcbfra
    #   DEPLOY_PATH       /home/fitcbfra/lastround-app
    # Optional secrets:
    #   PHP_BIN           Server PHP 8.3 binary, if `php` is not 8.3
    #   COMPOSER_BIN      Defaults to /home/fitcbfra/bin/composer
    #   HEALTHCHECK_URL   Defaults to https://lastround.online/up

    env:
      COMPOSER_BIN: ${{ secrets.COMPOSER_BIN }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
      PHP_BIN: ${{ secrets.PHP_BIN }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USER: ${{ secrets.SSH_USER }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, fileinfo, intl
          tools: composer:v2

      - name: Install npm dependencies and build frontend assets
        run: |
          npm ci
          npm run build
          echo "Built assets:"
          find public/build -type f | sort

      - name: Validate Composer dependencies
        run: |
          composer validate --no-check-publish
          composer install --no-interaction --prefer-dist --optimize-autoloader --no-progress

      - name: Run automated tests
        run: |
          cp .env.example .env
          php artisan key:generate --force --no-interaction
          php artisan test --without-tty

      - name: Require deployment secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          missing=()
          for name in SSH_PRIVATE_KEY SSH_KNOWN_HOSTS SSH_HOST SSH_PORT SSH_USER DEPLOY_PATH; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done

          if ((${#missing[@]})); then
            echo "::error::Missing required GitHub Actions secrets: ${missing[*]}"
            echo "Configure these repository secrets, authorize the matching public key in cPanel SSH Access, then re-run this workflow."
            echo "Do not put private keys, .env files, or database credentials in the repository."
            exit 1
          fi

          if [[ "$SSH_HOST" != "premium350.web-hosting.com" ]]; then
            echo "::error::SSH_HOST must be premium350.web-hosting.com to avoid deploying to the wrong host."
            exit 1
          fi

          if [[ "$SSH_PORT" != "21098" ]]; then
            echo "::error::SSH_PORT must be 21098."
            exit 1
          fi

          if [[ "$SSH_USER" != "fitcbfra" ]]; then
            echo "::error::SSH_USER must be fitcbfra."
            exit 1
          fi

          if [[ "${DEPLOY_PATH%/}" != "/home/fitcbfra/lastround-app" ]]; then
            echo "::error::DEPLOY_PATH must be /home/fitcbfra/lastround-app."
            exit 1
          fi

          if [[ "$SSH_HOST" == *fitcaretta* || "$DEPLOY_PATH" == *fitcaretta* ]]; then
            echo "::error::Refusing to deploy to fitcaretta-beta.space."
            exit 1
          fi

      - name: Package the release
        run: bash .github/scripts/package-release.sh lastround-release.tar.gz

      - name: Inspect the release archive
        run: |
          echo "Archive size: $(du -h lastround-release.tar.gz | awk '{print $1}')"
          tar -tzf lastround-release.tar.gz > release-listing.txt
          grep 'public/build/' release-listing.txt | sed -n '1,40p'
          if grep -E '(^|/)\.env$' release-listing.txt; then
            echo "::error::Archive contains .env"
            exit 1
          fi
          if grep -E '(^|/)(vendor|node_modules|storage)/' release-listing.txt; then
            echo "::error::Archive contains vendor, node_modules, or storage files"
            exit 1
          fi

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          umask 077
          mkdir -p ~/.ssh

          if [[ ! "$SSH_HOST" =~ ^[A-Za-z0-9.-]+$ ]]; then
            echo "::error::Invalid SSH_HOST"
            exit 1
          fi
          if [[ ! "$SSH_PORT" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid SSH_PORT"
            exit 1
          fi
          if [[ ! "$SSH_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid SSH_USER"
            exit 1
          fi

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/lastround_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > ~/.ssh/known_hosts

          {
            echo "Host lastround-production"
            echo "  HostName ${SSH_HOST}"
            echo "  Port ${SSH_PORT}"
            echo "  User ${SSH_USER}"
            echo "  IdentityFile ${HOME}/.ssh/lastround_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ${HOME}/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ConnectTimeout 30"
          } > ~/.ssh/config

          chmod 600 ~/.ssh/lastround_deploy ~/.ssh/known_hosts ~/.ssh/config

      - name: Connect and deploy over SSH
        run: |
          HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://lastround.online/up}"
          COMPOSER_BIN="${COMPOSER_BIN:-/home/fitcbfra/bin/composer}"

          if [[ "$HEALTHCHECK_URL" != https://lastround.online/* ]]; then
            echo "::error::HEALTHCHECK_URL must be an https://lastround.online URL."
            exit 1
          fi

          ssh lastround-production 'printf "SSH connection OK as %s\n" "$(whoami)"'
          remote_user="$(ssh lastround-production 'whoami')"
          if [[ "$remote_user" != "fitcbfra" ]]; then
            echo "::error::Unexpected remote user: ${remote_user}"
            exit 1
          fi

          remote_home="$(ssh lastround-production 'printf %s "$HOME"')"
          remote_archive="${remote_home}/tmp/lastround-release-${GITHUB_SHA}.tar.gz"

          ssh lastround-production 'mkdir -p "$HOME/tmp"'
          ssh lastround-production "cat > '${remote_archive}'" < lastround-release.tar.gz

          ssh lastround-production \
            "DEPLOY_PATH='${DEPLOY_PATH%/}' \
             PHP_BIN='${PHP_BIN}' \
             COMPOSER_BIN='${COMPOSER_BIN}' \
             RELEASE_ARCHIVE='${remote_archive}' \
             HEALTHCHECK_URL='${HEALTHCHECK_URL}' \
             GIT_SHA='${GITHUB_SHA}' \
             bash -s" \
            < .github/scripts/deploy-on-server.sh

      - name: Verify the public health endpoint
        run: |
          HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://lastround.online/up}"
          curl -fsS --retry 5 --retry-all-errors --retry-delay 3 --max-time 30 "$HEALTHCHECK_URL"
          echo
          echo "Production health check passed for ${HEALTHCHECK_URL}"
